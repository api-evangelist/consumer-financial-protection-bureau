description: >-
  The Consumer Financial Protection Bureau (CFPB) is the U.S. federal agency that supervises banks, lenders, and other
  financial companies, enforces federal consumer financial laws, and publishes large public datasets via open APIs. The
  CFPB Open Tech program publishes the Consumer Complaint Database (CCDB) search API and the HMDA Platform's Data
  Browser and Institutions APIs at ffiec.cfpb.gov, all unauthenticated and CC0-licensed for public use.
